<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Remote">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="/manifest.json">
<title>TV Remote</title>
<style>
/* Design tokens.
   Surfaces: cool slate, not pure black. Text #eef1f6 / dim #8c97a9 (5.6:1 on --card).
   Each TV gets its own colour (--tv), set from JS, used on its card, its identity line and its play button, so you can
   tell at a glance which TV you are controlling. Source badges keep their brand colours.
   Type: the iPhone's rounded system face; tabular numerals for times and volume. No emoji for controls: SVG icons. */
:root{--bg:#0b0e14;--card:#141922;--card2:#1d2431;--line:#2a3344;--fg:#eef1f6;--dim:#8c97a9;
  --ok:#4ade80;--warn:#ffb547;--bad:#ff6b6b;--tv:#62b0ff;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));max-width:560px;margin:auto}
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:6px;margin:2px 2px 14px;min-height:44px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.grow{flex:1}
#dot{width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}#dot.on{background:var(--ok)}
h2{font-size:15px;font-weight:600;color:var(--dim);margin:26px 4px 10px}
.card{background:var(--card);border-radius:var(--r);padding:16px}
button,select,input{font:inherit;color:var(--fg);border:0;border-radius:14px;background:var(--card2)}
button{min-height:52px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s,filter .12s}
button{position:relative;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active{transform:scale(.95);filter:brightness(1.4)}
/* busy: the command is on its way. The label fades and a spinner takes its place until the TV answers. */
button.busy{pointer-events:none}
button.busy>*{opacity:0}
button.busy::after{content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--tv,var(--fg));animation:spin .8s linear infinite}
button.ok{animation:okflash .6s ease-out}
button.fail{animation:shake .4s}
@keyframes okflash{0%{box-shadow:0 0 0 0 var(--tv,var(--ok))}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
button.fail{box-shadow:inset 0 0 0 2px var(--bad)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--tv);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1;min-width:0}
.hide{display:none!important}
.sub{color:var(--dim);font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--dim)}
.badge.Kick{background:#53fc18;color:#000}.badge.Twitch{background:#9146ff;color:#fff}
.badge.YouTube{background:#d90029;color:#fff}.badge.live{background:#d92d3a;color:#fff}
#back{min-height:44px;background:none;color:var(--dim);padding:0 10px 0 0;gap:2px;font-size:15px}
/* TV cards (All TVs and the share picker) */
.tvcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:16px 16px 16px 20px;margin-bottom:12px;
  position:relative;overflow:hidden;min-height:44px}
.tvcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tv)}
.tvcard .ch{display:flex;align-items:center;gap:8px}.tvcard .ch b{font-size:21px;flex:1;font-weight:700}
.tvcard .now{margin-top:10px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tvcard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tvcard.down{opacity:.6}.tvcard.down::before{background:var(--line)}
.tvcard.last{box-shadow:inset 0 0 0 2px var(--tv)}
.tvcard .msg{margin-top:8px;font-size:14px}.tvcard .msg.bad{color:var(--bad)}
.tvcard:disabled{cursor:default}
.hd{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--dim)}
.hd.smooth{background:var(--ok);border-color:var(--ok);opacity:.6}
.hd.buffering{background:var(--warn);border-color:var(--warn)}.hd.error{background:var(--bad);border-color:var(--bad)}
.hw{font-size:13px;font-weight:600}.hw.buffering{color:var(--warn)}.hw.error{color:var(--bad)}
.link{color:var(--dim);font-size:14px;margin:0 4px 14px;overflow-wrap:anywhere}
/* One TV */
.tvid{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:2px 4px 14px}
.tvid b{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.tvid b::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--tv)}
.now.card{padding:18px}
.ttl{font-size:22px;font-weight:700;line-height:1.2;margin:12px 0 6px;overflow-wrap:anywhere;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#meta{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.pp{width:100%;min-height:92px;margin-top:16px;border-radius:26px;background:var(--tv);color:#0b0e14;font-size:20px;font-weight:700;gap:12px}
.pp .ic{width:40px;height:40px}
.pp.paused{background:transparent;color:var(--tv);box-shadow:inset 0 0 0 3px var(--tv)}
.sq{width:52px;flex:none;padding:0}
.vol{display:flex;align-items:center;gap:10px;margin-top:14px}
#volv{width:2.4em;text-align:right;font-variant-numeric:tabular-nums;font-size:18px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;margin:0;padding:0;background:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--tv) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--fg);margin-top:-11px;border:4px solid var(--card)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--tv)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);border:4px solid var(--card)}
.row3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;margin-top:14px}
select{min-height:52px;padding:0 12px;width:100%}
.danger{color:var(--bad)}
input[type=text]{width:100%;padding:0 14px;min-height:52px}
.seg button{background:var(--card2)}.seg button.on{background:var(--fg);color:#0b0e14;font-weight:700}
.go{background:var(--tv);color:#0b0e14;font-weight:700}
.pad button{min-height:56px}
/* favourites and search */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid.list{grid-template-columns:minmax(0,1fr)}
.viewtog{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:3px}
.viewtog button{min-height:40px;width:44px;padding:0;background:none;color:var(--dim);border-radius:10px}
.viewtog button[aria-pressed=true]{background:var(--card2);color:var(--fg)}
.bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.bar h2{margin:0}
#editTvs{min-height:44px;background:none;color:var(--dim);padding:0 8px 0 12px;font-size:15px}
.tvrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);
  padding:14px 16px 14px 20px;margin-bottom:12px;position:relative;overflow:hidden;min-height:64px;justify-content:flex-start}
.tvrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tv)}
.tvrow .grow{flex:1;min-width:0}.tvrow b{font-size:19px;display:block}
.tvrow[aria-checked=false]{opacity:.55}.tvrow[aria-checked=false]::before{background:var(--line)}
.sw{width:54px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .15s}
.tvrow[aria-checked=true] .sw{background:var(--tv)}.tvrow[aria-checked=true] .sw::after{transform:translateX(22px)}
.fav{position:relative;background:var(--card);border-radius:16px;padding:12px;min-height:72px;text-align:left;display:block;width:100%;min-width:0}
.fav b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:30px;margin-bottom:6px}
.fav{overflow:hidden}
.fav .starting{display:none;font-size:13px;color:var(--dim)}
.fav .spin{display:none;position:absolute;right:12px;bottom:12px;width:18px;height:18px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--tv,var(--fg));animation:spin .8s linear infinite}
.fav.loading{pointer-events:none}.fav.loading .badge{display:none}
.fav.loading .starting{display:inline}.fav.loading .spin{display:block}
.fav.loading::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--tv,var(--fg));animation:slide 1.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.fav .x{position:absolute;top:0;right:0;width:44px;min-height:44px;background:none;color:var(--dim);padding:0}
.res{display:flex;gap:10px;background:var(--card);border-radius:16px;padding:8px;margin-bottom:8px;width:100%;text-align:left;align-items:center;justify-content:flex-start}
.res img{width:112px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:#000;flex:none}
.res small{color:var(--dim);display:block}
/* debug drawer */
#scrim{position:fixed;inset:0;background:#0009;z-index:10}
#drawer{position:fixed;left:0;right:0;bottom:0;height:85vh;max-width:560px;margin:auto;background:var(--card);z-index:11;
  border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.dh{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-bottom:1px solid var(--line)}
.dh b{flex:1}.dh span{color:var(--dim);font-size:12px}.dh button{min-height:44px;width:44px;padding:0;background:none}
.db{overflow:auto;padding:4px 18px 18px;font:12px/1.4 ui-monospace,Menlo,monospace}
.db h3{font:600 12px ui-rounded,system-ui,sans-serif;color:var(--dim);margin:16px 0 4px}
.db td{padding:1px 8px 1px 0;vertical-align:top;word-break:break-all}.db td:first-child{color:var(--dim);white-space:nowrap}
.db pre{margin:0;white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto}
#err{color:var(--bad);min-height:1em;margin:10px 4px 0;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
  button.busy::after{animation:none;border-top-color:var(--line);border-right-color:var(--tv,var(--fg))}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.9.9 0 001.4.8l10.2-6.8a.9.9 0 000-1.6L9.4 4.4A.9.9 0 008 5.2z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor" stroke="none"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.6" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l5 4.2V5.3L7.6 9.5z" fill="currentColor" stroke="none"/><path d="M16 9.2a4.2 4.2 0 010 5.6M18.8 6.6a8 8 0 010 10.8"/></symbol>
<symbol id="i-volume-low" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l5 4.2V5.3L7.6 9.5z" fill="currentColor" stroke="none"/><path d="M16 9.5a3.3 3.3 0 010 5"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l5 4.2V5.3L7.6 9.5z" fill="currentColor" stroke="none"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z"/></symbol>
<symbol id="i-star-fill" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z" fill="currentColor"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8.3M7 6.8a7.5 7.5 0 1010 0"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M6 11.5l6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v13M6 12.5l6 6 6-6"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H6M11.5 6l-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V19a1 1 0 01-1 1h-4.5v-5.5h-5V20H5a1 1 0 01-1-1z"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><path d="M5 7.5l4.5 4.5L5 16.5M12 17h7"/></symbol>
<symbol id="i-hdmi" viewBox="0 0 24 24"><path d="M4.5 8h15v5.5l-3 3.2h-9l-3-3.2z"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="5" y="5" width="5.5" height="5.5" rx="1.2"/><rect x="13.5" y="5" width="5.5" height="5.5" rx="1.2"/><rect x="5" y="13.5" width="5.5" height="5.5" rx="1.2"/><rect x="13.5" y="13.5" width="5.5" height="5.5" rx="1.2"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
</defs></svg>

<header>
  <button id="back" class="hide" aria-label="Back to all TVs"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>All TVs</button>
  <h1>TV Remote</h1><span class="grow"></span>
  <span id="dot" role="img" aria-label="Connection to the Pi"></span>
</header>

<section id="view-all" class="hide">
  <div class="bar"><h2 id="allhead">Your TVs</h2>
    <button id="editTvs" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span>Edit</span></button></div>
  <div id="cards"></div>
</section>

<section id="view-share" class="hide">
  <h2 id="pickhead" style="margin-top:6px">Play on which TV?</h2>
  <p id="sharedlink" class="link"></p>
  <div id="pastebox" class="card hide">
    <b>No link found</b>
    <p class="sub">The shared text didn't contain a link. Paste one here.</p>
    <input type="text" id="pastein" placeholder="https://..." inputmode="url" autocapitalize="off" autocorrect="off" aria-label="Link to play">
    <div class="row"><button id="pastego" class="go">Use this link</button></div>
  </div>
  <div id="pickcards"></div>
</section>

<section id="view-tv" class="hide">
<div id="tvid" class="tvid"></div>
<div class="card now" id="now">
  <div><span class="badge" id="src">Idle</span> <span class="badge live hide" id="live">LIVE</span></div>
  <div id="title" class="ttl">Nothing playing</div>
  <div id="meta"></div>
  <button id="pp" class="pp" data-a="pause" aria-label="Pause or resume"></button>
  <div class="row" id="seek">
    <button data-a="seek" data-v="-60" aria-label="Back 60 seconds">&minus;60</button><button data-a="seek" data-v="-10" aria-label="Back 10 seconds">&minus;10</button>
    <button data-a="seek" data-v="10" aria-label="Forward 10 seconds">+10</button><button data-a="seek" data-v="60" aria-label="Forward 60 seconds">+60</button>
  </div>
  <div class="vol">
    <button id="mute" class="sq" data-a="mute" aria-label="Mute"></button>
    <input type="range" id="vol" min="0" max="100" step="1" aria-label="Volume">
    <b id="volv">100</b>
  </div>
  <div class="row3"><select id="qual" aria-label="Quality"></select>
    <button id="fav"></button>
    <button id="stop" class="danger"><svg class="ic" aria-hidden="true"><use href="#i-stop"/></svg>Stop</button></div>
</div>
<div id="err" role="status"></div>

<h2 id="tvhead">TV</h2>
<div class="card hide" id="tvctl">
  <div class="row"><button data-k="PowerOn"><svg class="ic" aria-hidden="true"><use href="#i-power"/></svg>On</button>
    <button data-k="PowerOff"><svg class="ic" aria-hidden="true"><use href="#i-power"/></svg>Off</button></div>
  <div class="row"><button data-k="VolumeDown" aria-label="TV volume down"><svg class="ic" aria-hidden="true"><use href="#i-volume-low"/></svg>&minus;</button>
    <button data-k="VolumeMute" aria-label="TV mute"><svg class="ic" aria-hidden="true"><use href="#i-mute"/></svg></button>
    <button data-k="VolumeUp" aria-label="TV volume up"><svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg>+</button></div>
  <div class="row"><button data-k="InputHDMI1"><svg class="ic" aria-hidden="true"><use href="#i-hdmi"/></svg>1</button>
    <button data-k="InputHDMI2"><svg class="ic" aria-hidden="true"><use href="#i-hdmi"/></svg>2</button>
    <button data-k="InputHDMI3"><svg class="ic" aria-hidden="true"><use href="#i-hdmi"/></svg>3</button></div>
  <details style="margin-top:12px"><summary style="min-height:44px;line-height:44px;color:var(--dim)">TV navigation</summary>
    <div class="pad">
    <div class="row"><button data-k="Home" aria-label="Home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg></button><button data-k="Up" aria-label="Up"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg></button><button data-k="Back" aria-label="Back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button></div>
    <div class="row"><button data-k="Left" aria-label="Left"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button><button data-k="Select" class="go">OK</button><button data-k="Right" aria-label="Right"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button></div>
    <div class="row"><button data-k="Info" aria-label="Info"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg></button><button data-k="Down" aria-label="Down"><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg></button><button data-k="Play" aria-label="Play or pause on the TV"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button></div>
    </div>
  </details>
</div>

<h2>Play something</h2>
<div class="card">
  <input type="text" id="link" placeholder="Paste a link, a channel name or a search" autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="Link, channel or search">
  <div class="row seg" id="site">
    <button data-s="kick" class="on">Kick</button><button data-s="twitch">Twitch</button><button data-s="youtube">YouTube</button>
  </div>
  <div class="row"><button id="go" class="go">Play</button></div>
</div>
<div id="results" style="margin-top:10px"></div>

<div class="bar" style="margin-top:26px"><h2>Favourites</h2><div class="viewtog">
  <button id="favList" aria-label="Show favourites as a list" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg></button>
  <button id="favTiles" aria-label="Show favourites as tiles" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg></button></div></div>
<div class="grid list" id="favs"></div>

<p style="text-align:center;margin-top:26px"><button id="dbgOpen" style="min-height:44px;background:none;color:var(--dim);font-size:14px"><svg class="ic" aria-hidden="true"><use href="#i-terminal"/></svg>Debug</button></p>
</section>

<div id="scrim" class="hide"></div>
<aside id="drawer" class="hide" aria-label="Debug">
  <div class="dh"><b>Debug</b><span id="dage"></span><button id="dbgClose" aria-label="Close debug"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="db">
    <h3>Player</h3><table id="d-player"></table>
    <h3>mpv</h3><table id="d-mpv"></table>
    <h3>Versions</h3><table id="d-ver"></table>
    <h3>Command</h3><pre id="d-cmd"></pre>
    <h3>player.log</h3><pre id="d-log"></pre>
  </div>
</aside>

<script>
const $ = id => document.getElementById(id);
let site = 'kick', st = {}, dragging = false, qualFor = null, favList = [], targets = [];
let target = '';  // the TV shown in the One TV view; set by the router
const TV_COLOURS = ['#62b0ff', '#ff8aa8', '#5ad6b0', '#b3a2ff'];
const tvColour = id => TV_COLOURS[Math.max(0, targets.findIndex(t => t.id === id)) % TV_COLOURS.length];
const ic = n => '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const setBtn = (b, icon, label) => { b.innerHTML = ic(icon) + (label ? '<span>' + label + '</span>' : ''); };  // static strings only
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const hiddenTvs = () => { try { return new Set(JSON.parse(localStorage.getItem('hiddenTvs') || '[]')); } catch (e) { return new Set(); } };
const saveHidden = s => { try { localStorage.setItem('hiddenTvs', JSON.stringify([...s])); } catch (e) {} };
const visibleTvs = () => { const h = hiddenTvs(); return targets.filter(t => !h.has(t.id)); };
let editing = false;
const view = () => location.pathname === '/share' ? 'share' : location.hash.startsWith('#/tv/') ? 'tv' : 'all';

// Run a button's command with feedback: spinner while it is in flight (at least `min` ms so a quick tap is still
// seen), then a brief confirm or shake. `hold` keeps the spinner a little longer after success for things that
// take the TV a moment, like changing input.
async function busy(btn, work, hold = 0, min = 450) {
  if (btn.classList.contains('busy')) return null;
  btn.classList.add('busy');
  const t0 = Date.now();
  let r = null;
  try { r = await work(); } catch (e) {}
  const ok = !!r && r.ok !== false;
  await new Promise(done => setTimeout(done, Math.max(0, min - (Date.now() - t0)) + (ok ? hold : 0)));
  btn.classList.remove('busy');
  btn.classList.add(ok ? 'ok' : 'fail');
  setTimeout(() => btn.classList.remove('ok', 'fail'), 700);
  return r;
}
document.addEventListener('touchstart', () => {}, {passive: true});  // iOS only shows :active pressed states once a touch listener exists

const err = m => { $('err').textContent = m || ''; if (m) setTimeout(() => $('err').textContent = '', 6000); };
async function api(path, method = 'GET', body) {
  try {
    const u = path + (path.includes('?') ? '&' : '?') + 'target=' + encodeURIComponent(target || 'living');
    const r = await fetch(u, {method, headers: body ? {'Content-Type': 'application/json'} : {},
      body: body ? JSON.stringify(body) : undefined});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) err(j.error || 'That didn’t work. Try again.');
    return j;
  } catch (e) { err('Can’t reach the Pi. Check you’re on the home Wi-Fi.'); return null; }
}
const cmd = (action, value, extra) => api('/api/cmd', 'POST', {action, value, ...extra});
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };

function render() {
  const run = st.running;
  $('src').textContent = run || st.starting ? (st.source || 'Other') : 'Idle';
  $('src').className = 'badge ' + (st.source || '');
  $('live').classList.toggle('hide', !(run && st.live));
  $('title').textContent = run ? (st.title || st.url) : st.starting ? 'Starting…' : st.error ? 'Playback stopped' : 'Nothing playing';
  let meta = [];
  if (run) {
    if (!st.live && st.position != null) meta.push(fmt(st.position) + (st.duration ? ' / ' + fmt(st.duration) : ''));
    if (st.live && st.position != null) meta.push('watching ' + fmt(st.position));
    if (st.height) meta.push(st.height + 'p');
    if (st.hwdec) meta.push((target === 'living' ? 'hw: ' : 'via ') + st.hwdec);
    if (st.drops != null) meta.push(st.drops + ' dropped');
  }
  if (!run && st.error) meta.push(st.error);
  $('meta').textContent = meta.join(' · ');
  $('pp').classList.toggle('paused', !!st.paused);
  setBtn($('pp'), st.paused ? 'play' : 'pause', st.paused ? 'Paused' : '');
  $('seek').classList.toggle('hide', !run || st.live);
  setBtn($('mute'), st.muted ? 'mute' : 'volume', '');
  $('mute').setAttribute('aria-label', st.muted ? 'Unmute' : 'Mute');
  if (!dragging && st.volume != null) { $('vol').value = st.volume; $('volv').textContent = Math.round(st.volume); }
  $('vol').style.setProperty('--p', $('vol').value + '%');
  const saved = favList.some(f => f.url === st.url);
  setBtn($('fav'), saved ? 'star-fill' : 'star', saved ? 'Saved' : 'Favourite');
  if (run && st.url !== qualFor) loadQualities();
  checkFavLoading();
}

async function loadQualities() {
  qualFor = st.url;
  const q = await api('/api/qualities');
  const sel = $('qual');
  sel.innerHTML = '';
  (q || []).forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
  sel.value = [...sel.options].map(o => o.value).find(v => String(st.quality).split(',').includes(v)) || '';
  sel.classList.toggle('hide', !sel.options.length);
}

async function poll() {
  if (view() !== 'tv') return;
  const s = await api('/api/status');
  if (s) { st = s; render(); }
}

async function loadFavs() {
  favList = await api('/api/favourites') || [];
  const g = $('favs');
  g.innerHTML = '';
  if (!favList.length) g.append(Object.assign(el('div', 'sub', 'No favourites yet. Tap the star while something is playing to save it.'), {style: 'grid-column:1/-1;padding:4px'}));
  favList.forEach(f => {
    const b = el('div', 'fav'); b.setAttribute('role', 'button'); b.tabIndex = 0; b.dataset.url = f.url;
    const x = el('button', 'x'); x.innerHTML = ic('x'); x.setAttribute('aria-label', 'Remove ' + f.name);
    x.onclick = async e => { e.stopPropagation(); await api('/api/favourites', 'DELETE', {url: f.url}); loadFavs(); };
    b.onclick = () => playFav(f.url);
    b.onkeydown = e => { if (e.key === 'Enter') playFav(f.url); };
    const spin = el('i', 'spin'); spin.setAttribute('aria-hidden', 'true');
    b.append(el('b', null, f.name), el('span', 'badge ' + (f.source || ''), f.source || 'Other'), el('span', 'starting', 'Starting\u2026'), spin, x);
    g.appendChild(b);
  });
  markFavs();
  render();
}

// A tapped favourite shows a spinner until that stream is playing (or fails, or 30 s pass).
let favLoading = null;  // {url, t0}
function markFavs() {
  document.querySelectorAll('#favs .fav').forEach(b => {
    const on = !!favLoading && b.dataset.url === favLoading.url;
    b.classList.toggle('loading', on);
    if (on) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy');
  });
}
async function playFav(url) {
  if (favLoading) return;
  favLoading = {url, t0: Date.now()}; markFavs();
  const r = await play(url);
  if (!r || !r.ok) { favLoading = null; markFavs(); }
}
function checkFavLoading() {
  if (!favLoading) return;
  const age = Date.now() - favLoading.t0;
  if ((st.running && st.url === favLoading.url) || (st.error && age > 1500) || age > 30000) { favLoading = null; markFavs(); }
}

async function play(text) {
  err();
  const r = await api('/api/play', 'POST', {url: text, site});
  if (r && r.ok) { $('link').value = ''; $('results').innerHTML = ''; setTimeout(poll, 1500); }
  return r;
}

async function search(q) {
  $('results').textContent = 'Searching…';
  const r = await api('/api/search?q=' + encodeURIComponent(q));
  const box = $('results');
  box.innerHTML = '';
  if (!Array.isArray(r) || !r.length) { box.textContent = 'No results. Try different words.'; return; }
  r.forEach(v => {
    const b = el('button', 'res');
    const img = document.createElement('img'); img.src = v.thumb; img.loading = 'lazy'; img.alt = '';
    const d = el('div');
    const c = el('small', null, [v.channel, v.live ? 'LIVE' : v.duration ? fmt(v.duration) : ''].filter(Boolean).join(' · '));
    d.append(el('div', null, v.title), c); b.append(img, d);
    b.onclick = () => play(v.url);
    box.appendChild(b);
  });
}

function go() {
  const t = $('link').value.trim();
  if (!t) return;
  if (site === 'youtube' && !/https?:\/\//.test(t)) search(t); else play(t);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if (b) { busy(b, () => cmd(b.dataset.a, b.dataset.v)).then(poll); return; }
  const s = e.target.closest('#site button');
  if (s) { site = s.dataset.s; document.querySelectorAll('#site button').forEach(x => x.classList.toggle('on', x === s)); }
});
$('go').onclick = go;
$('link').onkeydown = e => { if (e.key === 'Enter') go(); };
$('stop').onclick = () => busy($('stop'), () => cmd('stop')).then(poll);
$('fav').onclick = async () => {
  if (!st.url) return;
  const had = favList.some(f => f.url === st.url);
  await api('/api/favourites', had ? 'DELETE' : 'POST', {url: st.url, name: had ? undefined : st.title});
  loadFavs();
};
$('qual').onchange = () => cmd('restart', null, {quality: $('qual').value}).then(() => setTimeout(poll, 1500));
$('vol').oninput = () => { dragging = true;
  if (st.muted && +$('vol').value > (st.volume || 0)) { st.muted = false; cmd('mute'); } // dragging up while muted unmutes (once)
  $('volv').textContent = $('vol').value; $('vol').style.setProperty('--p', $('vol').value + '%'); cmd('volume', $('vol').value); };
$('vol').onchange = () => { dragging = false; };

// ---- favourites layout: list or tiles ----
let favView = 'list';
try { favView = localStorage.getItem('favView') || 'list'; } catch (e) {}
function applyFavView() {
  $('favs').classList.toggle('list', favView === 'list');
  $('favList').setAttribute('aria-pressed', String(favView === 'list'));
  $('favTiles').setAttribute('aria-pressed', String(favView === 'tiles'));
  try { localStorage.setItem('favView', favView); } catch (e) {}
}
$('favList').onclick = () => { favView = 'list'; applyFavView(); };
$('favTiles').onclick = () => { favView = 'tiles'; applyFavView(); };
applyFavView();

// ---- debug drawer ----
let dbgTimer = null;
function fillTable(id, obj) {
  const t = $(id); t.innerHTML = '';
  Object.entries(obj || {}).forEach(([k, v]) => {
    const r = t.insertRow(); r.insertCell().textContent = k;
    r.insertCell().textContent = v == null ? '–' : typeof v === 'object' ? JSON.stringify(v) : v;
  });
  if (!t.rows.length) t.insertRow().insertCell().textContent = 'not running';
}
async function dbgTick() {
  const d = await api('/api/debug');
  if (!d || !d.proc) { $('dage').textContent = 'unreachable'; return; }
  const s = d.state || {};
  fillTable('d-player', {url: s.url, source: s.source, player: s.player, quality: s.quality, pid: d.proc.pid,
    returncode: d.proc.returncode, uptime_s: d.uptime, last_error: d.last_error});
  fillTable('d-mpv', d.mpv); fillTable('d-ver', d.versions);
  $('d-cmd').textContent = (s.cmd || []).join(' ');
  const log = $('d-log'), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = d.log;
  if (stick) log.scrollTop = log.scrollHeight;
  $('dage').textContent = new Date().toLocaleTimeString();
}
function dbg(open) {
  if (open) $('dage').textContent = 'loading…';
  $('drawer').classList.toggle('hide', !open); $('scrim').classList.toggle('hide', !open);
  clearInterval(dbgTimer);
  if (open) { dbgTick(); dbgTimer = setInterval(dbgTick, 2000); }
}
$('dbgOpen').onclick = () => dbg(true);
$('dbgClose').onclick = $('scrim').onclick = () => dbg(false);

// ---- cards and router ----
const POWER = {PowerOn: 'on', Ready: 'standby', DisplayOff: 'screen off'};

function healthWord(c) {
  const h = (c.health || {}).state;
  return !c.reachable ? '' : h === 'buffering' ? 'Buffering' : h === 'error' ? 'Problem' : '';
}

function cardEl(c, onTap, extra) {
  const b = el('button', 'tvcard' + (c.reachable ? '' : ' down'));
  b.type = 'button';
  b.style.setProperty('--tv', tvColour(c.id));
  const head = el('div', 'ch');
  const dot = el('i', 'hd ' + (c.reachable ? (c.health || {}).state || 'idle' : 'idle'));
  dot.setAttribute('aria-hidden', 'true');
  head.append(el('b', null, c.name), dot, el('span', 'hw ' + ((c.health || {}).state || ''), healthWord(c)));
  const size = c.size ? c.size + '″' : '';
  const sub = [[c.brand, size].filter(Boolean).join(' '), c.model].filter(Boolean).join(' · ');
  const n = c.now;
  const line = !c.reachable ? "Can't reach this TV" : n && n.starting ? 'Starting…' : n ? (n.paused ? 'Paused: ' : 'Playing: ') + n.title : c.error ? "Couldn't play: " + c.error : 'Nothing playing';
  b.append(head, el('div', 'sub', [sub, c.connection].filter(Boolean).join(' · ')), el('div', 'now', line));
  const tags = el('div', 'tags');
  if (c.reachable && n && !n.starting) {
    tags.append(el('span', 'badge ' + (n.source || ''), n.source || 'Other'));
    if (n.live) tags.append(el('span', 'badge live', 'LIVE'));
    if (n.stream) tags.append(el('span', 'badge', n.stream));
  }
  const pw = c.reachable ? [POWER[c.power] || c.power, c.input && c.input !== 'Roku' ? c.input : null].filter(Boolean).join(' · ') : '';
  if (pw) tags.append(el('span', 'sub', pw));
  if (tags.childNodes.length) b.append(tags);
  if (extra) b.append(extra);
  b.setAttribute('aria-label', c.name + '. ' + line + (healthWord(c) ? '. ' + healthWord(c) : ''));
  b.onclick = () => onTap(c);
  return b;
}

function tvRow(c) {  // edit mode: one switch per TV
  const on = !hiddenTvs().has(c.id);
  const b = el('button', 'tvrow'); b.type = 'button';
  b.setAttribute('role', 'switch'); b.setAttribute('aria-checked', String(on));
  b.style.setProperty('--tv', tvColour(c.id));
  const size = c.size ? c.size + '\u2033' : '';
  const sub = [[c.brand, size].filter(Boolean).join(' '), c.model, c.connection].filter(Boolean).join(' \u00b7 ');
  const txt = el('div', 'grow'); txt.append(el('b', null, c.name), el('span', 'sub', sub));
  b.append(txt, el('span', 'sw'));
  b.setAttribute('aria-label', 'Show ' + c.name + ' on the home screen');
  b.onclick = () => { const h = hiddenTvs(); if (h.has(c.id)) h.delete(c.id); else h.add(c.id); saveHidden(h); renderCards(); };
  return b;
}

function renderCards() {
  if (view() !== 'all') return;
  const box = $('cards');
  $('allhead').textContent = editing ? 'Show these TVs' : 'Your TVs';
  $('editTvs').setAttribute('aria-pressed', String(editing));
  $('editTvs').innerHTML = ic(editing ? 'check' : 'sliders') + '<span>' + (editing ? 'Done' : 'Edit') + '</span>';
  if (!targets.length) { box.replaceChildren(el('p', 'sub', 'Looking for your TVs\u2026')); return; }
  if (editing) { box.replaceChildren(...targets.map(tvRow)); return; }
  const vis = visibleTvs();
  if (!vis.length) { box.replaceChildren(el('p', 'sub', 'All your TVs are hidden. Tap Edit to show some.')); return; }
  box.replaceChildren(...vis.map(c => cardEl(c, t => { location.hash = '#/tv/' + encodeURIComponent(t.id); })));
}
$('editTvs').onclick = () => { editing = !editing; renderCards(); };

function tvInfo() {  // the TV details in the One TV view come from the same cached card
  const cur = targets.find(t => t.id === target) || {};
  $('view-tv').style.setProperty('--tv', tvColour(target));
  $('tvctl').classList.toggle('hide', !cur.roku);
  $('tvhead').classList.toggle('hide', !cur.roku);
  const state = cur.reachable === false ? "can't reach" : POWER[cur.power] || cur.power;
  $('tvhead').textContent = [cur.tv_name || 'TV controls', state, cur.input && cur.input !== 'Roku' ? cur.input : null].filter(Boolean).join(' · ');
  const id = $('tvid');
  id.replaceChildren();
  if (view() === 'tv' && cur.id) {  // which TV am I controlling? the wrong-TV guard lives here as much as in the picker
    const size = cur.size ? cur.size + '″' : '';
    id.append(el('b', null, cur.name),
      el('span', 'sub', [[cur.brand, size].filter(Boolean).join(' '), cur.model, cur.connection].filter(Boolean).join(' · ')));
    if (healthWord(cur)) id.append(el('span', 'hw ' + cur.health.state, healthWord(cur)));
  }
}

let cardSig = '';
async function loadTargets() {
  let ok = false, changed = false;
  try {
    const r = await fetch('/api/targets');
    const j = await r.json();
    if (Array.isArray(j)) {
      // redraw only when something visible changed: rebuilding the cards every poll can swallow a tap on the picker
      const sig = JSON.stringify(j, (k, v) => k === 'position' ? undefined : v);
      changed = sig !== cardSig; cardSig = sig; targets = j; ok = true;
    }
  } catch (e) {}
  $('dot').classList.toggle('on', ok);
  if (changed) { renderCards(); tvInfo(); if (view() === 'share') renderPicker(); }
}

function show() {
  const v = view();
  if (v === 'tv') {
    const id = decodeURIComponent(location.hash.slice(5));
    if (id !== target) {
      target = id; st = {}; qualFor = null; $('qual').innerHTML = '';
      try { localStorage.setItem('target', id); } catch (e) {}
      loadFavs(); poll();
    }
  }
  ['all', 'share', 'tv'].forEach(n => $('view-' + n).classList.toggle('hide', n !== v));
  $('back').classList.toggle('hide', v !== 'tv');
  renderCards(); tvInfo();
  if (v === 'share') renderPicker();
}
window.addEventListener('hashchange', show);
window.addEventListener('popstate', show);
$('back').onclick = () => { location.hash = '#/'; };

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const k = b.dataset.k;
  const hold = k === 'PowerOn' ? 4000 : /^Input/.test(k) ? 2500 : 0;  // the TV takes a moment to wake or change input
  const r = await busy(b, () => api('/api/roku/key', 'POST', {key: k}), hold);
  if (r && r.ok) setTimeout(loadTargets, 500);
});

// ---- share picker: /share?u=<link> ----
const picker = {url: '', started: false, busy: '', msg: {}};
const extractUrl = t => { const m = (t || '').match(/https?:\/\/[^\s<>"']+/); return m ? m[0].replace(/[).,]+$/, '') : ''; };
const shorten = u => u.length > 70 ? u.slice(0, 67) + '…' : u;
const lastTv = () => { try { return localStorage.getItem('lastTv') || ''; } catch (e) { return ''; } };

function renderPicker() {
  if (!picker.started) { picker.url = extractUrl(new URLSearchParams(location.search).get('u')); picker.started = true; }
  $('sharedlink').textContent = picker.url ? shorten(picker.url) : '';
  $('sharedlink').classList.toggle('hide', !picker.url);
  $('pastebox').classList.toggle('hide', !!picker.url);
  const last = lastTv();
  const ordered = visibleTvs().sort((a, b) => (b.id === last) - (a.id === last));
  if (!ordered.length) { $('pickcards').replaceChildren(el('p', 'sub', targets.length ? 'All your TVs are hidden. Open the home screen and tap Edit to show some.' : 'Looking for your TVs\u2026')); return; }
  $('pickcards').replaceChildren(...ordered.map(c => {
    const note = picker.busy === c.id ? el('div', 'msg', 'Starting on ' + c.name + '…')
      : picker.msg[c.id] ? el('div', 'msg bad', picker.msg[c.id]) : null;
    const b = cardEl(c, playOn, note);
    b.disabled = !c.reachable || !picker.url || !!picker.busy;
    if (c.id === last) b.classList.add('last');
    return b;
  }));
}

async function playOn(c) {
  picker.busy = c.id; delete picker.msg[c.id]; renderPicker();
  let ok = false, msg = '';
  try {
    const r = await fetch('/api/play?target=' + encodeURIComponent(c.id), {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: picker.url})});
    const j = await r.json().catch(() => ({}));
    ok = r.ok && j.ok !== false;
    msg = j.error || (r.ok ? '' : "Couldn't start playback.");
  } catch (e) { msg = "Couldn't reach the Pi. Check that you're on the home Wi-Fi."; }
  picker.busy = '';
  if (ok) {
    try { localStorage.setItem('lastTv', c.id); } catch (e) {}
    history.replaceState(null, '', '/#/tv/' + encodeURIComponent(c.id));
    show();
  } else { picker.msg[c.id] = msg || "Couldn't start playback."; renderPicker(); }
}

$('pastego').onclick = () => {
  const u = extractUrl($('pastein').value);
  if (u) { picker.url = u; renderPicker(); } else $('pastein').focus();
};
$('pastein').onkeydown = e => { if (e.key === 'Enter') $('pastego').click(); };

// /?target=<id> is where /play redirects; send it to that TV's remote
const redirectTarget = new URLSearchParams(location.search).get('target');
if (location.pathname === '/' && !location.hash && redirectTarget) history.replaceState(null, '', '/#/tv/' + encodeURIComponent(redirectTarget));
show();
loadTargets(); setInterval(loadTargets, 3000);
setInterval(poll, 2000);
</script>
</body>
</html>
