<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TV home</title>
<style>
:root{--bg:#0b0e14;--card:#151a26;--fg:#e8ecf4;--dim:#8d97ab;--ring:#4da3ff;--live:#e0243a}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 500px at 15% -10%,#16264a 0%,transparent 70%),radial-gradient(900px 500px at 100% 0%,#1d1840 0%,transparent 65%),var(--bg);color:var(--fg);font:600 22px system-ui,sans-serif}
/* two soft colour patches drifting very slowly: each is one pre-drawn gradient moved as a layer, so it costs the Pi next to nothing */
.glow{position:absolute;width:1300px;height:1300px;border-radius:50%;pointer-events:none;will-change:transform;z-index:0}
.g1{left:-500px;top:-700px;background:radial-gradient(circle,#2a4a9a55 0%,transparent 65%);animation:d1 70s ease-in-out infinite alternate}
.g2{right:-600px;top:-300px;background:radial-gradient(circle,#4a2a9a40 0%,transparent 65%);animation:d2 90s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(520px,260px)}}@keyframes d2{to{transform:translate(-460px,360px)}}
#head{position:absolute;left:40px;right:40px;top:26px;height:84px;display:flex;align-items:center;gap:20px;z-index:3}
#head img{width:60px;height:60px;border-radius:14px}
#head .brand{font-size:34px;font-weight:800;letter-spacing:.3px}
#head .grow{flex:1}
#wx{display:none;align-items:center;gap:14px;padding:8px 20px;border-radius:18px;background:#ffffff0d}
#wx svg{width:46px;height:46px}
#wx .t{font-size:40px;font-weight:800;line-height:1}
#wx .s{font-size:16px;color:var(--dim);line-height:1.3}
#clock{text-align:right;line-height:1.1}
#clock .time{font-size:56px;font-weight:800;letter-spacing:1px}
#clock .date{font-size:20px;color:var(--dim)}
#rows{z-index:1;position:absolute;left:40px;top:120px;width:1840px;transition:transform .3s ease}
.row{height:350px;position:relative;overflow:hidden}
.row h2{margin:0 0 0 22px;font-size:26px;color:var(--dim);font-weight:700}
.strip{display:flex;gap:22px;transition:transform .25s ease;padding:16px 24px 24px 22px}
.card{flex:0 0 330px;height:258px;background:var(--card);border-radius:18px;position:relative;transition:transform .2s,box-shadow .2s;overflow:hidden}
.card.f{transform:scale(1.07);box-shadow:0 0 0 4px var(--ring),0 20px 40px #000a;z-index:2}
.card img.t{width:330px;height:186px;object-fit:cover;display:block}
.card .ph{width:330px;height:186px;display:flex;align-items:center;justify-content:center}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#2a3350;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.card .ph .av{width:110px;height:110px;font-size:46px}
.stack{display:flex;align-items:center}.stack .av{width:92px;height:92px;font-size:38px;border:4px solid var(--card);margin-left:-26px}.stack .av:first-child{margin-left:0}
.card .small{position:absolute;left:12px;top:154px;border:3px solid var(--card)}
.name{position:absolute;left:86px;top:196px;right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:23px}
.name.solo{left:16px}
.game{position:absolute;left:86px;top:226px;right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px;color:var(--dim)}
.game.solo{left:16px}
.chip{position:absolute;top:10px;border-radius:8px;padding:2px 10px;font-size:16px;background:#000a}
.live{left:10px;background:var(--live)}.view{right:10px}
.empty[hidden]{display:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--dim)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div id="head"><img src="/logo.svg" alt=""><span class="brand">TV Remote</span><span class="grow"></span>
  <div id="wx"><span id="wxi"></span><div><div class="t" id="wxt"></div><div class="s" id="wxs"></div></div></div>
  <div id="clock"><div class="time" id="ct"></div><div class="date" id="cd"></div></div></div>
<div id="rows"></div><div class="empty" id="empty" hidden>Nothing here yet. Add favourites on your phone.</div>
<script>
const K = new URLSearchParams(location.search).get('k') || '';
const q = p => p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(K);
let sig = '', cur = {row: 0, col: 0};
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const num = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
function avatar(t, cls) {
  if (t.avatar) { const i = el('img', 'av ' + (cls || '')); i.src = q(t.avatar); return i; }
  return el('div', 'av ' + (cls || ''), (t.name || '?').trim().charAt(0).toUpperCase());
}
function card(t) {
  const c = el('div', 'card');
  if (t.thumb) { const i = el('img', 't'); i.src = q(t.thumb); c.append(i); if (t.live) c.append(el('span', 'chip live', 'LIVE')); if (t.viewers != null) c.append(el('span', 'chip view', num(t.viewers))); c.append(avatar(t, 'small'), el('div', 'name', t.name), el('div', 'game', t.game || t.title || ''));
  } else {
    const ph = el('div', 'ph');
    if (t.kind === 'group' && t.members && t.members.length) { const st = el('div', 'stack'); t.members.forEach(m => st.append(avatar(m))); ph.append(st); } else ph.append(avatar(t));
    c.append(ph);
    if (t.live) c.append(el('span', 'chip live', 'LIVE'));
    c.append(el('div', 'name solo', t.name), el('div', 'game solo', t.game || t.title || (t.kind === 'group' ? 'Group' : '')));
  }
  return c;
}
function focus() {
  document.querySelectorAll('.card.f').forEach(c => c.classList.remove('f'));
  const rows = document.querySelectorAll('.row');
  const r = rows[cur.row]; if (!r) return;
  const strip = r.querySelector('.strip'), cards = strip.children, c = cards[cur.col];
  if (c) c.classList.add('f');
  strip.style.transform = 'translateX(' + -Math.max(0, cur.col - 4) * 352 + 'px)';
  document.getElementById('rows').style.transform = 'translateY(' + -Math.max(0, cur.row - 1) * 350 + 'px)';
}
function draw(d) {
  const s = JSON.stringify(d.rows);
  if (s !== sig) {
    sig = s; const box = document.getElementById('rows'); box.replaceChildren();
    d.rows.forEach(r => { const row = el('div', 'row'); row.append(el('h2', null, r.title)); const st = el('div', 'strip'); r.tiles.forEach(t => st.append(card(t))); row.append(st); box.append(row); });
    document.getElementById('empty').hidden = d.rows.length > 0;
  }
  cur = {row: d.row, col: d.col}; focus();
}
async function tick() { try { draw(await (await fetch(q('/tv/data'), {cache: 'no-store'})).json()); } catch (e) {} }
async function focusTick() { try { const f = await (await fetch(q('/tv/focus'), {cache: 'no-store'})).json(); if (f.row !== cur.row || f.col !== cur.col) { cur = f; focus(); } } catch (e) {} }
// the header: the clock follows the Pi's (or the weather place's) time zone, the weather comes from the app (never from the internet directly)
let off = 0;
const ICON = {
  sun: '<circle cx="24" cy="24" r="9" fill="#ffc83d"/><g stroke="#ffc83d" stroke-width="3" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M10 38l4-4M34 14l4-4"/></g>',
  moon: '<path d="M32 30A14 14 0 0 1 18 10a14 14 0 1 0 14 20z" fill="#cfd8ff"/>',
  cloud: '<path d="M14 36h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#aab6cf"/>',
  rain: '<path d="M14 30h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#8c9ab8"/><g stroke="#5aa9ff" stroke-width="3" stroke-linecap="round"><path d="M17 35l-2 7M25 35l-2 7M33 35l-2 7"/></g>',
  snow: '<path d="M14 30h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#aab6cf"/><g fill="#fff"><circle cx="16" cy="39" r="2.5"/><circle cx="25" cy="42" r="2.5"/><circle cx="34" cy="39" r="2.5"/></g>',
  storm: '<path d="M14 28h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#7d8aa8"/><path d="M26 28l-6 9h5l-3 8 9-11h-5z" fill="#ffc83d"/>',
  fog: '<g stroke="#aab6cf" stroke-width="4" stroke-linecap="round"><path d="M8 18h32M12 26h28M8 34h32"/></g>'
};
const iconFor = (c, day) => c === 0 ? (day ? 'sun' : 'moon') : c <= 2 ? (day ? 'sun' : 'moon') : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c <= 67 || (c >= 80 && c <= 82) ? 'rain' : c <= 77 || c === 85 || c === 86 ? 'snow' : 'storm';
function clock() {
  const d = new Date(Date.now() + off * 1000);  // read with the UTC getters: the offset is already added
  const h = d.getUTCHours(), m = String(d.getUTCMinutes()).padStart(2, '0');
  document.getElementById('ct').textContent = (h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
  document.getElementById('cd').textContent = d.toLocaleDateString('en-CA', {weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC'});
}
async function info() {
  try {
    const j = await (await fetch(q('/tv/info'), {cache: 'no-store'})).json(); off = j.offset || 0; clock();
    const w = j.weather, box = document.getElementById('wx'); box.style.display = w ? 'flex' : 'none';
    if (w) {
      document.getElementById('wxi').innerHTML = '<svg viewBox="0 0 48 48">' + ICON[iconFor(w.code, w.day)] + '</svg>';
      document.getElementById('wxt').textContent = w.temp + '°' + w.unit;
      document.getElementById('wxs').textContent = 'H ' + w.hi + '°  L ' + w.lo + '° · ' + w.place.split(',')[0];
    }
  } catch (e) {}
}
tick(); info(); setInterval(tick, 2000); setInterval(focusTick, 150); setInterval(info, 300000); setInterval(clock, 10000);
</script></body></html>
