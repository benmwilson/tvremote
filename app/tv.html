<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TV home</title>
<style>
:root{--bg:#0b0e14;--card:#151a26;--fg:#e8ecf4;--dim:#8d97ab;--ring:#4da3ff;--live:#e0243a}
*{cursor:none!important}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 500px at 15% -10%,#16264a 0%,transparent 70%),radial-gradient(900px 500px at 100% 0%,#1d1840 0%,transparent 65%),var(--bg);color:var(--fg);font:600 22px system-ui,sans-serif}
#head{position:absolute;left:40px;right:40px;top:26px;height:84px;display:flex;align-items:center;gap:20px;z-index:3}
#head img{width:60px;height:60px;border-radius:14px}
#head .brand{font-size:34px;font-weight:800;letter-spacing:.3px}
#head .grow{flex:1}
#others{display:flex;gap:10px;margin-left:12px}#others span{font-size:18px;color:var(--dim);background:#ffffff0d;border-radius:14px;padding:6px 14px}
#wx{display:none;align-items:center;gap:14px;padding:8px 20px;border-radius:18px;background:#ffffff0d}
#wx svg{width:46px;height:46px}
#wx .t{font-size:40px;font-weight:800;line-height:1}
#wx .s{font-size:16px;color:var(--dim);line-height:1.3}
#clock{text-align:right;line-height:1.1}
#clock .time{font-size:56px;font-weight:800;letter-spacing:1px}
#clock .date{font-size:20px;color:var(--dim)}
#rows{z-index:1;position:absolute;left:40px;top:120px;width:1840px;will-change:transform}
.row{height:350px;position:relative;overflow:hidden}
.row h2{margin:0 0 0 22px;font-size:26px;color:var(--dim);font-weight:700}
.strip{display:flex;gap:22px;padding:16px 24px 24px 22px;will-change:transform}
.card{flex:0 0 330px;height:258px;background:var(--card);border-radius:18px;position:relative;overflow:hidden}
.card.f{box-shadow:0 0 0 5px var(--ring)}
.card img.t{width:330px;height:186px;object-fit:cover;display:block}
.card .ph{width:330px;height:186px;display:flex;align-items:center;justify-content:center}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#2a3350;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.card .ph .av{width:110px;height:110px;font-size:46px}
.stack{display:flex;align-items:center}.stack .face{position:relative;margin-left:-26px}.stack .face:first-child{margin-left:0}.stack .av{width:92px;height:92px;font-size:38px;border:4px solid var(--card)}
.face i{z-index:5;position:absolute;right:2px;bottom:2px;width:22px;height:22px;border-radius:50%;background:var(--live);border:4px solid var(--card)}
.card .small{position:absolute;left:12px;top:154px;border:3px solid var(--card)}
.name{position:absolute;left:86px;top:196px;right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:23px}
.name.solo{left:16px}
.game{position:absolute;left:86px;top:226px;right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px;color:var(--dim)}
.game.solo{left:16px}
.chip{position:absolute;top:10px;border-radius:8px;padding:2px 10px;font-size:16px;background:#000a}
.live{left:10px;background:var(--live)}.view{right:10px}
#note{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:9;background:#e0243a;color:#fff;border-radius:16px;padding:14px 32px;font-size:30px;font-weight:800;box-shadow:0 6px 24px #0008}
#note[hidden]{display:none}
.empty[hidden]{display:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--dim)}

/* boot intro: only while the server has marked this load as the first after the app started (body.intro); transform and opacity only, so it stays smooth on the Pi */
#intro{display:none;position:fixed;inset:0;z-index:50;background:radial-gradient(900px 600px at 50% 45%,#13213f 0%,#0b0e14 70%);flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
body.intro #intro{display:flex}
#intro .stage{position:relative;width:320px;height:320px;display:flex;align-items:center;justify-content:center}
#intro .mark{width:190px;height:190px;border-radius:42px;opacity:0;transform:scale(.55);animation:ipop .9s .35s cubic-bezier(.2,.9,.25,1.25) forwards;box-shadow:0 0 60px #4da3ff55}
#intro svg.ring{position:absolute;inset:0;width:320px;height:320px;transform:rotate(-90deg)}
#intro svg.ring circle{fill:none;stroke:#4da3ff;stroke-width:4;stroke-linecap:round;stroke-dasharray:942;stroke-dashoffset:942;animation:idraw 1.5s .1s cubic-bezier(.5,0,.2,1) forwards}
#intro .pulse{position:absolute;width:190px;height:190px;border-radius:44px;border:3px solid #4da3ff;opacity:0;animation:ipulse 2.6s 1.2s ease-out infinite}
#intro .pulse.b{animation-delay:2.5s}
#intro .word{margin-top:34px;font-size:72px;font-weight:800;letter-spacing:10px;opacity:0;transform:translateY(24px);animation:irise .9s 1s cubic-bezier(.2,.8,.2,1) forwards}
#intro .word b{color:#4da3ff;font-weight:800}
#intro ul{list-style:none;margin:34px 0 0;padding:0;width:560px;display:flex;flex-direction:column;gap:10px}
#intro li{font-size:26px;color:var(--dim);opacity:0;transform:translateX(-16px);transition:opacity .4s,transform .4s,color .4s;display:flex;align-items:center;gap:14px}
#intro li::before{content:"";width:14px;height:14px;border-radius:50%;border:3px solid #4da3ff66;box-sizing:border-box;flex:none}
#intro li.on{opacity:1;transform:none}
#intro li.ok{color:var(--fg)}
#intro li.ok::before{background:#4da3ff;border-color:#4da3ff}
#intro #ibar{margin-top:26px;width:560px;height:6px;border-radius:3px;background:#ffffff14;overflow:hidden}
#intro #ibar i{display:block;height:100%;background:linear-gradient(90deg,#4da3ff,#9b6bff);transform-origin:left;transform:scaleX(0);transition:transform .7s cubic-bezier(.3,.8,.3,1)}
#intro.out{animation:iout .8s cubic-bezier(.5,0,.8,.4) forwards}
body.reveal .card{animation:cardin .7s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--i,0) * 70ms)}
body.reveal #head{animation:cardin .7s both cubic-bezier(.2,.8,.2,1)}
@keyframes ipop{to{opacity:1;transform:scale(1)}}
@keyframes idraw{to{stroke-dashoffset:0}}
@keyframes ipulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes irise{to{opacity:1;transform:none}}
@keyframes iout{to{opacity:0;transform:scale(1.12)}}
@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
</style></head><body>
<div id="intro"><div class="stage"><svg class="ring" viewBox="0 0 320 320"><circle cx="160" cy="160" r="150"/></svg><span class="pulse"></span><span class="pulse b"></span><img class="mark" src="/logo.svg" alt=""></div>
  <div class="word">TV <b>REMOTE</b></div>
  <ul id="isteps"><li>Starting up</li><li>Finding your TVs</li><li>Checking who&rsquo;s live</li><li>Opening your launcher</li></ul>
  <div id="ibar"><i></i></div></div>
<div id="head"><img src="/logo.svg" alt=""><span class="brand">TV Remote</span><span id="others"></span><span class="grow"></span>
  <div id="wx"><span id="wxi"></span><div><div class="t" id="wxt"></div><div class="s" id="wxs"></div></div></div>
  <div id="clock"><div class="time" id="ct"></div><div class="date" id="cd"></div></div></div>
<div id="note" hidden></div><div id="rows"></div><div class="empty" id="empty" hidden>Nothing here yet. Add favourites on your phone.</div>
<script>
const K = new URLSearchParams(location.search).get('k') || '';
const report = m => { try { fetch('/tv/log?k=' + encodeURIComponent(K) + '&m=' + encodeURIComponent(String(m).slice(0, 300))); } catch (e) {} };
window.onerror = (m, s, l, c) => report(m + ' @' + l + ':' + c);
window.addEventListener('unhandledrejection', e => report('rejected: ' + e.reason));
const q = p => p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(K);
let cur = {row: 0, col: 0};
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const num = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
function avatar(t, cls) {
  if (t.avatar) { const i = el('img', 'av ' + (cls || '')); i.src = q(t.avatar); return i; }
  return el('div', 'av ' + (cls || ''), (t.name || '?').trim().charAt(0).toUpperCase());
}
function card(t) {
  const c = el('div', 'card'); c._t = t;
  if (t.thumb) { const i = el('img', 't'); i.src = q(t.thumb); c.append(i); if (t.live) c.append(el('span', 'chip live', 'LIVE')); if (t.viewers != null) c.append(el('span', 'chip view', num(t.viewers))); c.append(avatar(t, 'small'), el('div', 'name', t.name), el('div', 'game', t.game || t.title || ''));
  } else {
    const ph = el('div', 'ph');
    if (t.kind === 'group' && t.members && t.members.length) { const st = el('div', 'stack'); t.members.forEach(m => { const f = el('div', 'face'); f.append(avatar(m)); if (m.live) f.append(el('i')); st.append(f); }); ph.append(st); } else ph.append(avatar(t));
    c.append(ph);
    if (t.live) c.append(el('span', 'chip live', 'LIVE'));
    c.append(el('div', 'name solo', t.name), el('div', 'game solo', t.game || t.title || (t.kind === 'group' ? 'Group' : '')));
  }
  return c;
}
// hover preview: after a pause on a live card its stream plays muted in the card, through the app's relay (never from the internet directly)
let pvCfg = {on: true, sound: true}, pvKey = '', pvCard = null, pvTimer = 0, pvHls = null, pvVideo = null;
const hs = document.createElement('script'); hs.src = q('/vendor/hls.min.js'); document.head.append(hs);
function stopPreview() {
  clearTimeout(pvTimer); if (pvHls) { pvHls.destroy(); pvHls = null; } if (pvVideo) { pvVideo.remove(); pvVideo = null; }
}
function preview(c) {
  stopPreview(); pvCard = c;
  const t = c && c._t;
  if (!pvCfg.on || !t || t.kind !== 'stream' || !t.live || !t.thumb) return;
  pvTimer = setTimeout(async () => {
    try {
      if (!window.Hls || !Hls.isSupported()) { report('preview: hls.js ' + (window.Hls ? 'has no MSE here' : 'did not load')); return; }
      const r = await (await fetch(q('/tv/pv?u=' + encodeURIComponent(t.url)), {cache: 'no-store'})).json();
      if (!r.ok || pvCard !== c || !c.isConnected) return;
      const v = el('video'); v.muted = !pvCfg.sound; v.volume = 0.7; v.autoplay = true; v.playsInline = true;
      v.style.cssText = 'position:absolute;left:0;top:0;width:330px;height:186px;object-fit:cover;background:#000';
      v.addEventListener('playing', () => { v.style.opacity = 1; }); v.style.opacity = 0;
      const im = c.querySelector('img.t'); im.after(v); pvVideo = v;  // right after the picture, so the chips stay on top
      pvHls = new Hls({capLevelToPlayerSize: true, maxBufferLength: 6, liveSyncDurationCount: 2});
      pvHls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { report('preview: ' + d.type + ' ' + d.details); stopPreview(); } });
      pvHls.loadSource(r.src); pvHls.attachMedia(v);
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });  // sound refused by the browser: the picture still plays
      pvTimer = setTimeout(stopPreview, 90000);  // a preview is a glance, not a viewing
    } catch (e) { report('preview: ' + e); }
  }, 1500);
}
function focus() {
  document.querySelectorAll('.card.f').forEach(c => c.classList.remove('f'));
  const rows = document.querySelectorAll('.row');
  const r = rows[cur.row]; if (!r) return;
  const strip = r.querySelector('.strip'), cards = strip.children, c = cards[cur.col];
  if (c) c.classList.add('f');
  const key = cur.row + ':' + cur.col + ':' + (c && c._t && c._t.url);  // the same focused tile (even if its card is rebuilt for a new viewer count) never restarts a preview
  if (key !== pvKey) { pvKey = key; preview(c); }
  strip.style.transform = 'translateX(' + -Math.max(0, cur.col - 4) * 352 + 'px)';
  document.getElementById('rows').style.transform = 'translateY(' + -Math.max(0, cur.row - 1) * 350 + 'px)';
}
function draw(d) {
  const box = document.getElementById('rows');
  const rows = [...box.children];
  while (rows.length > d.rows.length) box.lastChild.remove(), rows.pop();
  d.rows.forEach((r, i) => {
    let row = rows[i];
    if (!row) { row = el('div', 'row'); row.append(el('h2'), el('div', 'strip')); box.append(row); }
    row.firstChild.textContent = r.title;
    const strip = row.lastChild, have = [...strip.children];
    r.tiles.forEach((t, j) => {  // only a card whose facts changed is rebuilt; the others (and their pictures) stay as they are
      const key = JSON.stringify(t);
      if (have[j] && have[j]._k === key) return;
      const c = card(t); c._k = key;
      if (have[j]) have[j].replaceWith(c); else strip.append(c);
    });
    while (strip.children.length > r.tiles.length) strip.lastChild.remove();
  });
  document.getElementById('empty').hidden = d.rows.length > 0;
  liveNow = ((d.rows.find(r => r.title === 'Live now') || {}).tiles || []).length;
  pvCfg = {on: d.preview !== false, sound: d.sound === true};  // the admin's switches (Settings > TV screen), live
  if (!pvCfg.on) stopPreview(); else if (pvVideo) pvVideo.muted = !pvCfg.sound;
  const nt = document.getElementById('note'); nt.textContent = d.note || ''; nt.hidden = !d.note;
  cur = {row: d.row, col: d.col}; focus();
}
async function tick() { try { draw(await (await fetch(q('/tv/data'), {cache: 'no-store'})).json()); } catch (e) {} }
async function focusTick() { try { const f = await (await fetch(q('/tv/focus'), {cache: 'no-store'})).json(); if (f.row !== cur.row || f.col !== cur.col) { cur = f; focus(); } } catch (e) {} }
// the header: the clock follows the Pi's (or the weather place's) time zone, the weather comes from the app (never from the internet directly)
let off = 0;
const ICON = {
  sun: '<circle cx="24" cy="24" r="9" fill="#ffc83d"/><g stroke="#ffc83d" stroke-width="3" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M10 38l4-4M34 14l4-4"/></g>',
  moon: '<path d="M32 30A14 14 0 0 1 18 10a14 14 0 1 0 14 20z" fill="#cfd8ff"/>',
  cloud: '<path d="M14 36h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#aab6cf"/>',
  rain: '<path d="M14 30h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#8c9ab8"/><g stroke="#5aa9ff" stroke-width="3" stroke-linecap="round"><path d="M17 35l-2 7M25 35l-2 7M33 35l-2 7"/></g>',
  snow: '<path d="M14 30h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#aab6cf"/><g fill="#fff"><circle cx="16" cy="39" r="2.5"/><circle cx="25" cy="42" r="2.5"/><circle cx="34" cy="39" r="2.5"/></g>',
  storm: '<path d="M14 28h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 7 7 0 0 0 1 13z" fill="#7d8aa8"/><path d="M26 28l-6 9h5l-3 8 9-11h-5z" fill="#ffc83d"/>',
  fog: '<g stroke="#aab6cf" stroke-width="4" stroke-linecap="round"><path d="M8 18h32M12 26h28M8 34h32"/></g>'
};
const iconFor = (c, day) => c === 0 ? (day ? 'sun' : 'moon') : c <= 2 ? (day ? 'sun' : 'moon') : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c <= 67 || (c >= 80 && c <= 82) ? 'rain' : c <= 77 || c === 85 || c === 86 ? 'snow' : 'storm';
function clock() {
  const d = new Date(Date.now() + off * 1000);  // read with the UTC getters: the offset is already added
  const h = d.getUTCHours(), m = String(d.getUTCMinutes()).padStart(2, '0');
  document.getElementById('ct').textContent = (h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
  document.getElementById('cd').textContent = d.toLocaleDateString('en-CA', {weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC'});
}
async function info() {
  try {
    const j = await (await fetch(q('/tv/info'), {cache: 'no-store'})).json(); off = j.offset || 0; clock();
    const oth = document.getElementById('others'); oth.replaceChildren(...(j.others || []).map(o => { const e = el('span', null, o.name + ' · ' + o.app); return e; }));
    const w = j.weather, box = document.getElementById('wx'); box.style.display = w ? 'flex' : 'none';
    if (w) {
      document.getElementById('wxi').innerHTML = '<svg viewBox="0 0 48 48">' + ICON[iconFor(w.code, w.day)] + '</svg>';
      document.getElementById('wxt').textContent = w.temp + '°' + w.unit;
      document.getElementById('wxs').textContent = 'H ' + w.hi + '°  L ' + w.lo + '° · ' + w.place.split(',')[0];
    }
  } catch (e) { report('info: ' + e); }
}
// the boot intro: the steps follow the real start (the TV list, who is live), each shown at least a moment; then it zooms away and the cards rise in
async function runIntro(pInfo, pTick) {
  const lis = [...document.querySelectorAll('#isteps li')], bar = document.querySelector('#ibar i');
  const wait = ms => new Promise(r => setTimeout(r, ms)), t0 = Date.now();
  const min = ms => wait(Math.max(0, ms - (Date.now() - t0)));
  const done = i => { lis[i].classList.add('ok'); bar.style.transform = 'scaleX(' + (i + 1) / lis.length + ')'; };
  lis[0].classList.add('on'); await min(1400); done(0);
  lis[1].classList.add('on'); await Promise.race([pInfo, wait(6000)]); await min(2300); done(1);
  lis[2].classList.add('on'); await Promise.race([pTick, wait(6000)]);
  lis[2].textContent = liveNow ? liveNow + ' live now' : 'Checking who\u2019s live';
  await min(3300); done(2);
  lis[3].classList.add('on'); await min(4200); done(3);
  await wait(350);
  document.querySelectorAll('.card').forEach((c, i) => c.style.setProperty('--i', Math.min(i, 12)));
  document.body.classList.add('reveal');
  const box = document.getElementById('intro'); box.classList.add('out');
  await wait(850); document.body.classList.remove('intro'); box.remove();
  setTimeout(() => document.body.classList.remove('reveal'), 2200);  // the entrance only plays once: later card rebuilds must not replay it
}
let liveNow = 0;
const pInfo = info(), pTick = tick();
if (document.body.classList.contains('intro')) runIntro(pInfo, pTick);
setInterval(tick, 2000); setInterval(focusTick, 150); setInterval(info, 60000); setInterval(clock, 10000);
</script></body></html>
