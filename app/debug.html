<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Remote Debug</title>
<style>
:root{--bg:#0b0b0f;--card:#17171f;--fg:#f2f2f7;--dim:#8e8e9a;--acc:#53fc18;--bad:#ff453a}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Menlo,monospace;max-width:900px;margin:auto}
a{color:var(--dim)}h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 6px}
.card{background:var(--card);border-radius:12px;padding:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%}td{padding:2px 8px 2px 0;vertical-align:top}td:first-child{color:var(--dim);white-space:nowrap}
pre{margin:0;white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto}
.bad{color:var(--bad)}.ok{color:var(--acc)}
</style>
</head>
<body>
<p><a href="/">← Remote</a> · <span id="age">loading…</span></p>
<h2>Player</h2><div class="card"><table id="player"></table></div>
<h2>mpv</h2><div class="card"><table id="mpv"></table></div>
<h2>Versions</h2><div class="card"><table id="ver"></table></div>
<h2>Command</h2><div class="card"><pre id="cmd"></pre></div>
<h2>player.log (tail)</h2><div class="card"><pre id="log"></pre></div>
<script>
const $ = id => document.getElementById(id);
function fill(id, obj) {
  const t = $(id); t.innerHTML = '';
  Object.entries(obj || {}).forEach(([k, v]) => {
    const r = t.insertRow(); r.insertCell().textContent = k;
    r.insertCell().textContent = v === null || v === undefined ? '–' : typeof v === 'object' ? JSON.stringify(v) : v;
  });
  if (!t.rows.length) t.insertRow().insertCell().textContent = 'not running';
}
async function tick() {
  try {
    const d = await (await fetch('/api/debug')).json();
    const s = d.state || {};
    fill('player', {url: s.url, source: s.source, player: s.player, quality: s.quality, pid: d.proc.pid,
      returncode: d.proc.returncode, uptime_s: d.uptime, last_error: d.last_error});
    fill('mpv', d.mpv);
    fill('ver', d.versions);
    $('cmd').textContent = (s.cmd || []).join(' ');
    const log = $('log'), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    log.textContent = d.log.replace(/\r/g, '\n');
    if (stick) log.scrollTop = log.scrollHeight;
    $('age').textContent = 'updated ' + new Date().toLocaleTimeString();
    $('age').className = 'ok';
  } catch (e) { $('age').textContent = 'Pi unreachable'; $('age').className = 'bad'; }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
