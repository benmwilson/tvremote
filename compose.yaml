services:
  tvremote:
    build: .
    image: tvremote:latest
    container_name: tvremote
    restart: unless-stopped
    network_mode: host # port ${PORT:-8765} on the LAN, no NAT
    user: "${PI_UID:-1000}:${PI_GID:-1000}"
    group_add: ["${VIDEO_GID:-44}", "${RENDER_GID:-992}", "${DOCKER_GID:-984}"] # numeric host GIDs (see .env.example)
    devices:
      - /dev/dri:/dev/dri
      - /dev/cec0:/dev/cec0
      - /dev/video10:/dev/video10 # H.264 decoder (v4l2m2m)
      - /dev/video11:/dev/video11
      - /dev/video12:/dev/video12
      - /dev/video13:/dev/video13
      - /dev/video14:/dev/video14
      - /dev/video15:/dev/video15
      - /dev/video16:/dev/video16
      - /dev/video18:/dev/video18
      - /dev/video19:/dev/video19
    volumes:
      - /run/user/${PI_UID:-1000}:/run/user/${PI_UID:-1000} # Wayland + PipeWire sockets
      - /etc/localtime:/etc/localtime:ro # the clock on the TV's Ready screen uses the Pi's time zone
      - /var/run/docker.sock:/var/run/docker.sock # Settings > Docker (start, stop, restart, logs). Whoever can use this socket has root on the Pi: delete this line to turn it off
      - tvremote-data:/data # favourites.json, player.log
    environment:
      - XDG_RUNTIME_DIR=/run/user/${PI_UID:-1000}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - PIPEWIRE_RUNTIME_DIR=/run/user/${PI_UID:-1000}
      - TVREMOTE_PORT=${PORT:-8765}
      - TVREMOTE_CEC_PHYS=${CEC_PHYS:-1.0.0.0}
      - TVREMOTE_CEC_NAME=HunnidPi
      - TVREMOTE_SHELL_VO=${SHELL_VO:-wlshm,gpu}
      - TVREMOTE_SHELL=${HOME_SCREEN:-1}  # 0 = never open the full-screen home screen (the Pi desktop stays usable)
      - TVREMOTE_NOWPLAYING_IPS=${NOWPLAYING_IPS:-}  # Roku addresses whose own-app title is read (empty: all)
      - TVREMOTE_PLEX_TOKEN=${PLEX_TOKEN:-}  # Plex titles on the TV cards
      - TVREMOTE_PLEX_URL=${PLEX_URL:-}  # e.g. http://192.168.1.50:32400 (needed with the token)
      - TVREMOTE_KICK_CLIENT_ID=${KICK_CLIENT_ID:-}
      - TVREMOTE_KICK_CLIENT_SECRET=${KICK_CLIENT_SECRET:-}
      - TVREMOTE_TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TVREMOTE_TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - TVREMOTE_KICK_REDIRECT=${KICK_REDIRECT:-}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:${PORT:-8765}/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  tvbrowser:
    # Draws the TV page (/tv) as the home screen while the launcher is on and nothing plays; the app starts and stops it with a flag file in /data.
    build:
      context: .
      dockerfile: docker/cog/Dockerfile
    image: tvbrowser:latest
    container_name: tvbrowser
    restart: unless-stopped
    network_mode: host
    user: "${PI_UID:-1000}:${PI_GID:-1000}"
    group_add: ["${VIDEO_GID:-44}", "${RENDER_GID:-992}"]
    devices:
      - /dev/dri:/dev/dri
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
      - /dev/video12:/dev/video12
    volumes:
      - /run/user/${PI_UID:-1000}/${WAYLAND_DISPLAY:-wayland-0}:/run/user/${PI_UID:-1000}/${WAYLAND_DISPLAY:-wayland-0} # only the Wayland socket, not the PipeWire ones
      - tvremote-data:/data:ro
      - /run/user/${PI_UID:-1000}/pulse:/run/user/${PI_UID:-1000}/pulse # the sound server's socket (PipeWire's Pulse one), for the launcher's preview sound
    # WebKit's own sandbox (bubblewrap) runs inside this container: the profile is Docker's default plus user namespaces and mounts for bwrap,
    # and /proc is unmasked so bwrap can mount its own. Only this container; the app container keeps Docker's default.
    security_opt:
      - seccomp=./docker/cog/seccomp.json
      - systempaths=unconfined
    environment:
      - XDG_RUNTIME_DIR=/run/user/${PI_UID:-1000}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - HOME=/tmp
      - PORT=${PORT:-8765}
      - COG_PLATFORM_WL_VIEW_FULLSCREEN=1
      - PULSE_SERVER=unix:/run/user/${PI_UID:-1000}/pulse/native

volumes:
  tvremote-data:
